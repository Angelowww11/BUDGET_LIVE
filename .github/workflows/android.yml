name: Check Android application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-check-build
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
